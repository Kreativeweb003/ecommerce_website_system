{% extends "base.html" %}

{% block title %}Delete address — Northfield{% endblock %}

{% block content %}
<div class="shell section--tight" style="max-width: 460px;">
  <div class="form-card form-card--wide">
    <h1 class="display-sm" style="margin-bottom: var(--sp-3);">Delete this address?</h1>
    <p class="text-soft" style="margin-bottom: var(--sp-5);">{{ address.street_address }}, {{ address.city }}</p>
    <form method="post">
      {% csrf_token %}
      <div class="row gap-3">
        <button type="submit" class="btn btn--danger">Delete</button>
        <a href="{% url 'accounts:address_list' %}" class="btn btn--ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
