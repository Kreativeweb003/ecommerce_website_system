{% extends "base.html" %}

{% block title %}Your profile — Northfield{% endblock %}

{% block content %}
<div class="shell section--tight" style="max-width: 720px;">
  <h1 class="display-lg" style="margin-bottom: var(--sp-6);">Your profile</h1>

  <div class="row gap-3" style="margin-bottom: var(--sp-6);">
    <a href="{% url 'accounts:profile' %}" class="btn btn--outline is-active">Profile</a>
    <a href="{% url 'accounts:change_password' %}" class="btn btn--ghost">Password</a>
    <a href="{% url 'accounts:address_list' %}" class="btn btn--ghost">Addresses</a>
    <a href="{% url 'orders:order_list' %}" class="btn btn--ghost">Orders</a>
  </div>

  <form method="post" class="form-card form-card--wide">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn--primary">Save changes</button>
  </form>
</div>
{% endblock %}
