{% extends "notifications/emails/_email_base.html" %}
{% block email_title %}Back in stock{% endblock %}
{% block email_body %}
  <h2 style="margin:0 0 8px; font-size:22px;">Back in stock, {{ first_name }}</h2>
  <p style="color:#5b5f6a; margin:0 0 16px;">An item on your wishlist is available again:</p>
  <p style="background:#ecebff; color:#2a27c4; padding:12px 16px; border-radius:8px; font-size:14px;">{{ item_name }}</p>
{% endblock %}
