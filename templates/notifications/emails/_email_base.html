<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block email_title %}Northfield{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:#f3f4f7; font-family: Arial, Helvetica, sans-serif; color:#14161a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f7; padding: 32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden;">
          <tr>
            <td style="padding: 28px 32px; border-bottom:1px solid #e4e5e9;">
              <span style="font-size:20px; font-weight:700; letter-spacing:-0.02em;">Northfield</span>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px;">
              {% block email_body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding: 24px 32px; border-top:1px solid #e4e5e9; font-size:12px; color:#9ca0ac;">
              &copy; {% now "Y" %} Northfield. You're receiving this because you have an account or placed an order with us.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
