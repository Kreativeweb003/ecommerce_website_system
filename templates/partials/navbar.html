{% load static %}
<header class="site-header">
  <div class="shell site-header__bar">
    <a href="{% url 'products:home' %}" class="logo row gap-2">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="9" width="3" height="6" rx="1.5" fill="var(--accent)"/>
        <rect x="7" y="5" width="3" height="14" rx="1.5" fill="var(--accent)"/>
        <rect x="12" y="2" width="3" height="20" rx="1.5" fill="var(--accent-dark)"/>
        <rect x="17" y="6" width="3" height="12" rx="1.5" fill="var(--accent)"/>
      </svg>
      Northfield
    </a>

    <nav class="nav-links">
      <a href="{% url 'products:home' %}" class="{% if request.resolver_match.url_name == 'home' %}is-active{% endif %}">Home</a>
      <a href="{% url 'products:product_list' %}" class="{% if request.resolver_match.url_name == 'product_list' %}is-active{% endif %}">Products</a>
      <a href="{% url 'products:product_list' %}?sort=newest">New arrivals</a>
      <a href="{% url 'wishlist:wishlist_detail' %}">Wishlist</a>
    </nav>

    <div class="nav-icons">
      <a href="{% url 'products:product_list' %}" class="icon-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </a>
      <a href="{% url 'accounts:profile' %}" class="icon-btn" aria-label="Account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      </a>
      <a href="{% url 'cart:cart_detail' %}" class="icon-btn" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1.4"/><circle cx="17" cy="21" r="1.4"/></svg>
        <span class="icon-badge js-cart-count">{{ cart_item_count|default:0 }}</span>
      </a>
      
      {% if user.is_superuser %}
        <a href="{% url 'dashboard:home' %}" class="btn btn--outline btn--sm">Admin panel</a>
      {% endif %}
      <a href="{% url 'products:product_list' %}" class="btn btn--primary btn--sm">Shop Now</a>
      <button class="icon-btn mobile-nav-toggle" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
