{% extends "base.html" %}

{% block title %}Add variant — {{ product.name }}{% endblock %}

{% block content %}
<div class="shell section--tight">
  <h1 class="display-lg" style="margin-bottom: var(--sp-2);">Add variant</h1>
  <p class="text-soft" style="margin-bottom: var(--sp-6);">For {{ product.name }}</p>

  <form method="post" enctype="multipart/form-data" class="form-card">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn--primary btn--block">Save variant</button>
  </form>
</div>
{% endblock %}
