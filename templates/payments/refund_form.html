{% extends "dashboard/_dash_base.html" %}

{% block dash_title %}Refund order{% endblock %}
{% block dash_heading %}Refund {{ order.order_number }}{% endblock %}

{% block dash_content %}
<form method="post" class="form-card">
  {% csrf_token %}
  <p class="text-soft" style="margin-bottom: var(--sp-4);">Order total: <span class="font-semibold">${{ order.total }}</span></p>
  <div class="field">
    <label for="reason">Reason</label>
    <textarea name="reason" id="reason" rows="3"></textarea>
  </div>
  <button type="submit" class="btn btn--danger btn--block">Process refund</button>
</form>
{% endblock %}
